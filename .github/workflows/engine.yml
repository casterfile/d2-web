name: engine
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        id: objects
        with:
          path: |
            build-wasm/obj
            build-wasm/stormlib-wasm64
          key: wasm64-${{ runner.os }}-${{ hashFiles('Dockerfile.builder64', 'tools/compiler-cache.sh') }}-${{ github.sha }}
          restore-keys: wasm64-${{ runner.os }}-${{ hashFiles('Dockerfile.builder64', 'tools/compiler-cache.sh') }}-
      - name: Build the existing WASM engine without game archives
        run: |
          set -euo pipefail
          docker build -f Dockerfile.builder64 -t d2-builder64 .
          # The builder's default hashes the actual installed compiler/sysroot.
          # An image's creation ID changes between hosted runners despite equal
          # compiler bytes, needlessly invalidating every cached native object.
          docker run --rm -v "$PWD:/build" -e D2_COMPILE_JOBS=2 d2-builder64 bash wasm-build/link-d2.sh
          node tools/engine-artifact-manifest.mjs
      # Retain successful object compilations even if another source or the link
      # fails; the canonical builder revalidates every dependency by content.
      - uses: actions/cache/save@v4
        if: failure() && steps.objects.outputs.cache-hit != 'true'
        with:
          path: |
            build-wasm/obj
            build-wasm/stormlib-wasm64
          key: wasm64-${{ runner.os }}-${{ hashFiles('Dockerfile.builder64', 'tools/compiler-cache.sh') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-engine
          path: |
            play/d2.js
            play/d2.wasm
            play/engine-artifact.json
          if-no-files-found: error
          retention-days: 30
